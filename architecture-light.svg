<svg xmlns="http://www.w3.org/2000/svg" width="2180" height="880" viewBox="0 0 2180 880" role="img" aria-label="A Fargate worker in a private subnet of your VPC opens an outbound HTTPS long-poll through the NAT gateway to the Managed Agents work queue at Anthropic, where the agent loop and its 06:00 UTC schedule run; the build server drives that control plane with an API key. At start ECS pulls the worker image from ECR and injects the environment key from Secrets Manager, both from inside the task; the worker writes logs to CloudWatch. The agent's tool calls run in the worker: psql to a private RDS PostgreSQL 17 database on port 5432 with an IAM auth token, and s3:PutObject of the report to an S3 bucket. A seed loader host, run once, downloads the Pagila data from S3 and loads it into the database. No arrow enters the VPC."><defs><marker id="a_e_ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475467"/></marker><marker id="a_e_work" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker><marker id="a_e_poll" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_nat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_img" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475467"/></marker><marker id="a_e_sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a_e_log" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475467"/></marker><marker id="a_e_pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="a_e_put" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a_e_seed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker><marker id="a_e_get" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker></defs><rect width="2180" height="880" fill="#ffffff"/><rect x="575" y="15" width="1030" height="180" rx="14" fill="none" stroke="#59636e" stroke-width="2" stroke-dasharray="6 6"/><text x="1589" y="43" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#59636e">Anthropic</text><rect x="575" y="255" width="1030" height="580" rx="14" fill="none" stroke="#59636e" stroke-width="2" stroke-dasharray="6 6"/><text x="1589" y="283" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#59636e">Your VPC: private subnets, nothing inbound</text><path d="M1720,115.0 H1585" fill="none" stroke="#475467" stroke-width="2" marker-end="url(#a_e_ctl)"/><text x="1650.0" y="103.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#475467" stroke="#ffffff" stroke-width="6" paint-order="stroke">HTTPS</text><path d="M1160,115.0 H1025" fill="none" stroke="#9a6700" stroke-width="2" marker-end="url(#a_e_work)"/><text x="1090.0" y="103.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#9a6700" stroke="#ffffff" stroke-width="6" paint-order="stroke">sessions</text><path d="M810.0,500 V415" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a_e_poll)"/><text x="824.0" y="461.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0969da" stroke="#ffffff" stroke-width="6" paint-order="stroke">443 out: long-poll</text><path d="M810.0,300 V175" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a_e_nat)"/><text x="824.0" y="227" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0969da" stroke="#ffffff" stroke-width="6" paint-order="stroke">HTTPS to Anthropic</text><path d="M600,520.0 H530.0 V355.0 H465" fill="none" stroke="#475467" stroke-width="2" marker-end="url(#a_e_img)"/><text x="530.0" y="343.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#475467" stroke="#ffffff" stroke-width="6" paint-order="stroke">pull image</text><path d="M600,555.0 H465" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#a_e_sec)"/><text x="530.0" y="579.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a7f37" stroke="#ffffff" stroke-width="6" paint-order="stroke">read key</text><path d="M600,590.0 H530.0 V755.0 H465" fill="none" stroke="#475467" stroke-width="2" marker-end="url(#a_e_log)"/><text x="518.0" y="661.0" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#475467" stroke="#ffffff" stroke-width="6" paint-order="stroke">logs</text><path d="M810.0,610 V695" fill="none" stroke="#8250df" stroke-width="2" marker-end="url(#a_e_pg)"/><text x="824.0" y="661.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#8250df" stroke="#ffffff" stroke-width="6" paint-order="stroke">5432, IAM token</text><path d="M1020,555.0 H1715" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#a_e_put)"/><text x="1370.0" y="543.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a7f37" stroke="#ffffff" stroke-width="6" paint-order="stroke">s3:PutObject reports/*</text><path d="M1160,755.0 H1025" fill="none" stroke="#9a6700" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#a_e_seed)"/><text x="1090.0" y="743.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#9a6700" stroke="#ffffff" stroke-width="6" paint-order="stroke">5432, once</text><path d="M1580,755.0 H1930.0 V615" fill="none" stroke="#9a6700" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#a_e_get)"/><text x="1944.0" y="661.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#9a6700" stroke="#ffffff" stroke-width="6" paint-order="stroke">seed/ download</text><rect x="600" y="60" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#9a6700" stroke-width="2"/><g transform="translate(620,100.0) scale(1.25)" fill="none" stroke="#9a6700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></g><text x="664.0" y="111.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">Work queue</text><text x="664.0" y="137.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">self-hosted environment</text><rect x="1160" y="60" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#8250df" stroke-width="2"/><g transform="translate(1180,100.0) scale(1.25)" fill="none" stroke="#8250df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></g><text x="1224.0" y="111.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">Agent loop + schedule</text><text x="1224.0" y="137.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">claude-haiku-5-5, cron 0 6 * * * UTC</text><rect x="1720" y="60" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#475467" stroke-width="2"/><g transform="translate(1740,100.0) scale(1.25)" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></g><text x="1784.0" y="111.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">Build server</text><text x="1784.0" y="137.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">ant apply, run-now.sh, API key</text><rect x="40" y="300" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#475467" stroke-width="2"/><g transform="translate(60,340.0) scale(1.25)" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></g><text x="104.0" y="351.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">Amazon ECR</text><text x="104.0" y="377.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">claude-agent-worker image</text><rect x="600" y="300" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#137e77" stroke-width="2"/><g transform="translate(620,340.0) scale(1.25)" fill="none" stroke="#137e77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M12 19h4.5a3.5 3.5 0 0 0 0-7h-8a3.5 3.5 0 0 1 0-7H12"/></g><text x="664.0" y="351.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">NAT gateway</text><text x="664.0" y="377.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">public subnet, the only way out</text><rect x="40" y="500" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/><g transform="translate(60,540.0) scale(1.25)" fill="none" stroke="#1a7f37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5"/></g><text x="104.0" y="551.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">Secrets Manager</text><text x="104.0" y="577.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">environment ID + environment key</text><rect x="600" y="500" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/><g transform="translate(620,540.0) scale(1.25)" fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></g><text x="664.0" y="551.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">Fargate worker</text><text x="664.0" y="577.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">no public IP, zero ingress rules</text><rect x="1720" y="500" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/><g transform="translate(1740,540.0) scale(1.25)" fill="none" stroke="#1a7f37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></g><text x="1784.0" y="551.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">S3 report bucket</text><text x="1784.0" y="577.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">reports/YYYY-MM-DD.md, versioned</text><rect x="40" y="700" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#475467" stroke-width="2"/><g transform="translate(60,740.0) scale(1.25)" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/></g><text x="104.0" y="751.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">CloudWatch Logs</text><text x="104.0" y="777.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">/ecs/claude-agent-worker</text><rect x="600" y="700" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#8250df" stroke-width="2"/><g transform="translate(620,740.0) scale(1.25)" fill="none" stroke="#8250df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g><text x="664.0" y="751.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">RDS PostgreSQL 17</text><text x="664.0" y="777.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">private, IAM auth, role agent_ro</text><rect x="1160" y="700" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#9a6700" stroke-width="2" stroke-dasharray="10 7"/><g transform="translate(1180,740.0) scale(1.25)" fill="none" stroke="#9a6700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></g><text x="1224.0" y="751.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">Seed loader</text><text x="1224.0" y="777.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">loads Pagila once, powers off</text></svg>